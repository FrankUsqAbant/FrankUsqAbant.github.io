<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="24" fill="#0f172a"/>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="none" stroke="#14b8a6" stroke-width="3" opacity="0.4"/>
  
  <!-- Cute Peruvian Llama Icon -->
  <g transform="translate(10, 10)">
    <!-- Ears -->
    <path d="M 28 22 Q 22 2 34 8 Q 38 18 32 24 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 30 18 Q 25 6 32 10 Z" fill="#ffb7b2"/>
    <path d="M 38 22 Q 34 0 46 4 Q 46 16 40 24 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 39 17 Q 36 4 43 7 Z" fill="#ffb7b2"/>

    <!-- Head & Neck -->
    <path d="M 24 28 C 24 16 46 16 48 28 L 52 56 C 54 64 34 68 28 58 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Snout & Nose -->
    <path d="M 40 25 C 58 24 62 36 48 40 Z" fill="#ffccaa" stroke="#f3b794" stroke-width="1.5"/>
    <circle cx="53" cy="31" r="2.5" fill="#334155"/>
    <path d="M 50 34 Q 53 37 55 34" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Eye -->
    <circle cx="37" cy="27" r="3" fill="#0f172a"/>
    <circle cx="38" cy="26" r="1" fill="#ffffff"/>

    <!-- Dev Teal Glasses -->
    <rect x="30" y="23" width="16" height="10" rx="3" fill="#14b8a6" opacity="0.95" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="46" y1="28" x2="52" y2="28" stroke="#14b8a6" stroke-width="1.5"/>

    <!-- Peruvian Andean Pom-pom Tassel -->
    <circle cx="28" cy="38" r="3.5" fill="#ef4444"/>
    <circle cx="28" cy="44" r="3" fill="#eab308"/>
  </g>
</svg>
